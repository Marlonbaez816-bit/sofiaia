<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sofía · Asistente IA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sofía">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23c084fc'/%3E%3Ctext x='50' y='67' font-size='45' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease;
            overflow: hidden;
        }

        /* Modo buenos días */
        body.morning {
            background: linear-gradient(145deg, #fef9e6, #fff4d6);
        }

        /* Modo buenas noches */
        body.night {
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 1rem;
            text-align: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-bottom: 0.5px solid rgba(0,0,0,0.05);
        }

        .header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .frase-dia {
            font-size: 0.7rem;
            color: #8b5cf6;
            margin-top: 0.2rem;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 85%;
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .user-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .sofi-bubble {
            background: rgba(255,255,255,0.9);
            color: #1f2937;
            border-bottom-left-radius: 0.3rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        body.night .sofi-bubble {
            background: #1e293b;
            color: #e2e8f0;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(145deg, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Mueca flotante (la que tocas) */
        .floating-avatar {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
            cursor: pointer;
            transition: 0.2s;
            z-index: 200;
        }

        .floating-avatar:active {
            transform: scale(0.95);
        }

        /* Teclado emergente (se abre al tocar la mueca) */
        .keyboard-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 0.8rem;
            display: flex;
            gap: 0.6rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 150;
            border-top: 0.5px solid #e2e8f0;
        }

        body.night .keyboard-area {
            background: #1e293b;
        }

        .keyboard-area.open {
            transform: translateY(0);
        }

        .keyboard-input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 0.9rem;
        }

        .keyboard-send {
            background: #8b5cf6;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.55rem;
            padding: 0.5rem;
            color: #9ca3af;
        }

        /* Emojis flotantes */
        .emoji-pop {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 250;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Tarjeta de gratitud */
        .gratitude-card {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: white;
            border-radius: 2rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 300;
            text-align: center;
            transition: 0.2s;
        }

        .gratitude-card.show {
            transform: translateX(-50%) scale(1);
        }

        body.night .gratitude-card {
            background: #1e293b;
            color: white;
        }

        .hidden-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4rem;
            transition: 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .hidden-image.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>✨ Sofía</h1>
        <div class="frase-dia" id="fraseDia"></div>
    </div>
    <div class="chat-container" id="chatContainer">
        <div class="message">
            <div class="avatar">✨</div>
            <div class="bubble sofi-bubble">Hola, soy Sofía. ¿En qué te ayudo? 💜</div>
        </div>
    </div>
    <div class="footer-note">Toca la mueca abajo a la derecha para escribir</div>
</div>

<div class="floating-avatar" id="floatingAvatar">✨</div>
<div class="keyboard-area" id="keyboardArea">
    <input type="text" id="keyboardInput" class="keyboard-input" placeholder="Escribe a Sofía...">
    <button class="keyboard-send" id="sendTextBtn">Enviar</button>
</div>
<div class="gratitude-card" id="gratitudeCard">💜 ¡Gracias a ti! 💜</div>
<div class="hidden-image" id="hiddenImage">💎</div>

<script>
    // ========== FRASE DEL DÍA ==========
    const frases = ["💪 "Hoy es un buen día para empezar"", "🌟 "Eres más fuerte de lo que crees"", "💜 "La felicidad se construye"", "🌱 "Pequeños pasos, grandes cambios""];
    document.getElementById('fraseDia').innerText = frases[Math.floor(Math.random() * frases.length)];

    // ========== ELEMENTOS ==========
    const chatContainer = document.getElementById('chatContainer');
    const floatingAvatar = document.getElementById('floatingAvatar');
    const keyboardArea = document.getElementById('keyboardArea');
    const keyboardInput = document.getElementById('keyboardInput');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const gratitudeCard = document.getElementById('gratitudeCard');
    const hiddenImage = document.getElementById('hiddenImage');

    // ========== FUNCIONES DE UI ==========
    function mostrarEmojiFlotante(emoji) {
        const emojiDiv = document.createElement('div');
        emojiDiv.className = 'emoji-pop';
        emojiDiv.innerHTML = emoji;
        emojiDiv.style.left = Math.random() * 70 + 15 + '%';
        emojiDiv.style.bottom = '80px';
        document.body.appendChild(emojiDiv);
        setTimeout(() => emojiDiv.remove(), 1000);
    }

    function mostrarTarjetaGratitud() {
        gratitudeCard.classList.add('show');
        setTimeout(() => gratitudeCard.classList.remove('show'), 2000);
    }

    function mostrarImagenOculta(emoji) {
        hiddenImage.innerHTML = emoji;
        hiddenImage.classList.add('show');
        setTimeout(() => hiddenImage.classList.remove('show'), 2000);
    }

    // ========== MODO BUENOS DÍAS / BUENAS NOCHES ==========
    function actualizarModo() {
        const hora = new Date().getHours();
        if (hora < 12) document.body.classList.add('morning');
        else document.body.classList.remove('morning');
        if (hora >= 20) document.body.classList.add('night');
        else document.body.classList.remove('night');
    }
    actualizarModo();

    // ========== AGREGAR MENSAJE AL CHAT ==========
    function addMessage(tipo, texto) {
        const div = document.createElement('div');
        div.className = `message ${tipo === 'user' ? 'user-message' : ''}`;
        if (tipo === 'user') {
            div.innerHTML = `<div class="avatar">👤</div><div class="bubble user-bubble">${escapeHtml(texto)}</div>`;
        } else {
            div.innerHTML = `<div class="avatar">✨</div><div class="bubble sofi-bubble">${escapeHtml(texto)}</div>`;
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ========== PROCESAR RESPUESTA ==========
    let conocimientosCargados = [];

    function procesarPregunta(pregunta) {
        const lower = pregunta.toLowerCase();
        let respuesta = null;

        for (let item of conocimientosCargados) {
            for (let palabra of item.palabrasClave) {
                if (lower.includes(palabra)) {
                    respuesta = item.respuesta;
                    break;
                }
            }
            if (respuesta) break;
        }

        if (!respuesta) {
            respuesta = "No tengo información sobre eso. Pregúntame otra cosa 💜";
        }

        addMessage('sofi', respuesta);

        // Efectos especiales
        if (lower.includes("gracias")) {
            mostrarTarjetaGratitud();
        }
        if (lower.includes("amor") || lower.includes("te quiero")) {
            mostrarImagenOculta("💜✨");
            mostrarEmojiFlotante("💕");
        }
        if (lower.includes("triste")) {
            mostrarEmojiFlotante("😢");
        }
        if (lower.includes("feliz")) {
            mostrarEmojiFlotante("🎉😊");
        }
        if (lower.includes("sorpresa")) {
            mostrarImagenOculta("🎁✨");
            mostrarEmojiFlotante("🎉");
            addMessage('sofi', "¡Sorpresa! 🎉✨");
        }
    }

    // ========== ENVIAR TEXTO ==========
    function enviarTexto() {
        const texto = keyboardInput.value.trim();
        if (texto === "") return;
        addMessage('user', texto);
        procesarPregunta(texto);
        keyboardInput.value = '';
        keyboardArea.classList.remove('open');
    }

    // ========== CARGAR CONOCIMIENTOS ==========
    const archivos = [
        'conocimientos/01-base.js',
        'conocimientos/02-personal.js',
        'conocimientos/03-gracioso.js',
        'conocimientos/04-ciencia.js',
        'conocimientos/05-historia.js',
        'conocimientos/06-mas.js'
    ];

    window.agregarConocimiento = function(item) {
        conocimientosCargados.push(item);
    };

    function cargarConocimientos() {
        archivos.forEach(archivo => {
            const script = document.createElement('script');
            script.src = archivo;
            script.onerror = () => console.log(`No se pudo cargar ${archivo}`);
            document.head.appendChild(script);
        });
        setTimeout(() => {
            console.log(`Conocimientos cargados: ${conocimientosCargados.length}`);
        }, 2000);
    }

    // ========== EVENTOS ==========
    floatingAvatar.addEventListener('click', () => {
        keyboardArea.classList.add('open');
        keyboardInput.focus();
    });

    sendTextBtn.addEventListener('click', enviarTexto);
    keyboardInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') enviarTexto();
    });

    document.addEventListener('click', (e) => {
        if (!keyboardArea.contains(e.target) && !floatingAvatar.contains(e.target)) {
            keyboardArea.classList.remove('open');
        }
    });

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Iniciar
    cargarConocimientos();
    setTimeout(() => {
        if (new Date().getHours() < 12) addMessage('sofi', '☀️ Buenos días. ¿Cómo amaneciste?');
        else if (new Date().getHours() >= 20) addMessage('sofi', '🌙 Buenas noches. Descansa bien.');
    }, 500);
</script>
</body>
    </html>
