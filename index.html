<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sofía · Asistente IA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sofía">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23c084fc'/%3E%3Ctext x='50' y='67' font-size='45' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui;
            background: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 1rem;
            text-align: center;
            background: white;
            border-bottom: 0.5px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .avatar-sofia {
            width: 45px;
            height: 45px;
            background: linear-gradient(145deg, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
        }

        .header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-text {
            text-align: center;
            font-size: 0.7rem;
            color: #8b5cf6;
            padding: 0.3rem;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 85%;
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .user-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .sofi-bubble {
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 0.3rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(145deg, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .input-area {
            background: white;
            border-top: 0.5px solid #e2e8f0;
            padding: 0.8rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 1px solid #e2e8f0;
            background: #f9fafb;
            font-size: 0.9rem;
        }

        .send-btn {
            background: #8b5cf6;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .mic-container {
            display: flex;
            justify-content: center;
            padding: 0.3rem;
        }

        .mic-large {
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
            transition: 0.1s;
            color: white;
        }

        .mic-large:active {
            transform: scale(0.95);
        }

        .mic-large.listening {
            background: #ef4444;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .options-panel {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.4rem;
            flex-wrap: wrap;
        }

        .opt-btn {
            background: #e2e8f0;
            border: none;
            padding: 0.35rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: #4a1d96;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.55rem;
            padding: 0.3rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="avatar-sofia">✨</div>
    <h1>Sofía</h1>
</div>

<div class="status-text" id="statusMsg">🎤 Toca el micrófono o escribe</div>

<div class="chat-container" id="chatContainer">
    <div class="message">
        <div class="avatar">✨</div>
        <div class="bubble sofi-bubble">¡Hola! Soy Sofía. Puedes hablarme o escribirme. 💜</div>
    </div>
</div>

<div class="mic-container">
    <button class="mic-large" id="micLargeBtn">🎙️</button>
</div>

<div class="input-area">
    <input type="text" id="textInput" class="text-input" placeholder="Escribe a Sofía...">
    <button class="send-btn" id="sendButton">Enviar</button>
</div>

<div class="options-panel">
    <button class="opt-btn" id="chisteBtn">😂 Chiste</button>
    <button class="opt-btn" id="saludoBtn">👋 Saludo</button>
    <button class="opt-btn" id="motivacionBtn">💪 Motivación</button>
    <button class="opt-btn" id="limpiarBtn">🗑️ Limpiar</button>
</div>

<div class="footer-note">🎤 Toca el micrófono · Se apaga solo · Datos guardados en tu teléfono</div>

<script>
    // ========== SISTEMA DE CONOCIMIENTOS ==========
    let conocimientos = [];

    window.agregarConocimiento = function(item) {
        conocimientos.push(item);
        console.log("Conocimiento agregado:", item.palabrasClave[0]);
    };

    // ========== GUARDAR CONVERSACIÓN ==========
    function guardarConversacion() {
        const container = document.getElementById('chatContainer');
        localStorage.setItem('sofia_chat', container.innerHTML);
    }

    function cargarConversacion() {
        const saved = localStorage.getItem('sofia_chat');
        if (saved) {
            document.getElementById('chatContainer').innerHTML = saved;
        }
    }

    // ========== VOZ Y MICRÓFONO ==========
    let synth = window.speechSynthesis;
    let recognition = null;
    let isListening = false;

    function hablar(texto) {
        if (synth.speaking) synth.cancel();
        let utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.95;
        synth.speak(utterance);
    }

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;
    }

    function iniciarEscucha() {
        if (!recognition) {
            document.getElementById('statusMsg').innerText = '❌ Voz no soportada';
            return;
        }
        if (isListening) return;
        
        isListening = true;
        const micBtn = document.getElementById('micLargeBtn');
        micBtn.classList.add('listening');
        document.getElementById('statusMsg').innerText = '🎤 Escuchando...';
        
        recognition.start();
        
        recognition.onresult = (event) => {
            const voiceText = event.results[0][0].transcript;
            document.getElementById('statusMsg').innerText = `💬 Dijiste: "${voiceText}"`;
            agregarMensaje('user', voiceText);
            procesarPregunta(voiceText);
            detenerEscucha();
        };
        
        recognition.onend = () => {
            detenerEscucha();
        };
        
        recognition.onerror = () => {
            document.getElementById('statusMsg').innerText = '❌ No te entendí';
            detenerEscucha();
        };
    }

    function detenerEscucha() {
        isListening = false;
        const micBtn = document.getElementById('micLargeBtn');
        micBtn.classList.remove('listening');
        if (!document.getElementById('statusMsg').innerText.includes('Dijiste')) {
            document.getElementById('statusMsg').innerText = '🎤 Toca el micrófono';
        }
    }

    // ========== AGREGAR MENSAJE ==========
    function agregarMensaje(tipo, texto) {
        const container = document.getElementById('chatContainer');
        const div = document.createElement('div');
        div.className = `message ${tipo === 'user' ? 'user-message' : ''}`;
        if (tipo === 'user') {
            div.innerHTML = `<div class="avatar">👤</div><div class="bubble user-bubble">${escapeHtml(texto)}</div>`;
        } else {
            div.innerHTML = `<div class="avatar">✨</div><div class="bubble sofi-bubble">${escapeHtml(texto)}</div>`;
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        guardarConversacion();
    }

    // ========== PROCESAR PREGUNTA ==========
    function procesarPregunta(pregunta) {
        const lower = pregunta.toLowerCase();
        let respuesta = null;
        
        for (let item of conocimientos) {
            for (let palabra of item.palabrasClave) {
                if (lower.includes(palabra)) {
                    respuesta = item.respuesta;
                    break;
                }
            }
            if (respuesta) break;
        }
        
        if (!respuesta) {
            respuesta = "No tengo información sobre eso. ¿Quieres que lo aprenda? 💜";
        }
        
        agregarMensaje('sofi', respuesta);
        hablar(respuesta);
        document.getElementById('statusMsg').innerText = '✅ Respondido';
        setTimeout(() => {
            if (!isListening) document.getElementById('statusMsg').innerText = '🎤 Toca el micrófono';
        }, 1500);
    }

    // ========== BOTONES ==========
    const chistes = ["¿Qué le dice una papa a otra? ¡Somos papás! 😂", "¿Qué hace una abeja en el gimnasio? ¡Zum-ba! 🐝"];
    const saludos = ["¡Hola! ¿Cómo andas? 💜", "¡Ey! Qué bueno verte ✨", "¡Holi! ¿En qué te ayudo?"];
    const frases = ["Eres más fuerte de lo que crees 💪", "Cada día es una nueva oportunidad 🌟"];

    document.getElementById('chisteBtn').onclick = () => {
        const chiste = chistes[Math.floor(Math.random() * chistes.length)];
        agregarMensaje('sofi', chiste);
        hablar(chiste);
    };
    document.getElementById('saludoBtn').onclick = () => {
        const saludo = saludos[Math.floor(Math.random() * saludos.length)];
        agregarMensaje('sofi', saludo);
        hablar(saludo);
    };
    document.getElementById('motivacionBtn').onclick = () => {
        const frase = frases[Math.floor(Math.random() * frases.length)];
        agregarMensaje('sofi', frase);
        hablar(frase);
    };
    document.getElementById('limpiarBtn').onclick = () => {
        document.getElementById('chatContainer').innerHTML = '<div class="message"><div class="avatar">✨</div><div class="bubble sofi-bubble">💜 Chat limpiado.</div></div>';
        localStorage.removeItem('sofia_chat');
        document.getElementById('statusMsg').innerText = '🗑️ Chat limpiado';
    };

    // ========== ENVIAR TEXTO ==========
    function enviarTexto() {
        const texto = document.getElementById('textInput').value.trim();
        if (texto === "") return;
        agregarMensaje('user', texto);
        procesarPregunta(texto);
        document.getElementById('textInput').value = '';
    }

    document.getElementById('micLargeBtn').onclick = iniciarEscucha;
    document.getElementById('sendButton').onclick = enviarTexto;
    document.getElementById('textInput').onkeypress = (e) => { if (e.key === 'Enter') enviarTexto(); };

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    cargarConversacion();
    setTimeout(() => hablar("Hola, soy Sofía"), 500);
</script>
