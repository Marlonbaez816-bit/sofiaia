<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sofía · Asistente Personal</title>
    
    <!-- Para instalación como app en iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sofía">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23f5f5f5'/%3E%3Ccircle cx='50' cy='50' r='45' fill='%23c084fc'/%3E%3Ctext x='50' y='67' font-size='40' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui;
            background: #ffffff;
            color: #1e1e2f;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 1rem;
            text-align: center;
            border-bottom: 0.5px solid #e2e8f0;
            background: white;
        }

        .header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-text {
            text-align: center;
            font-size: 0.7rem;
            color: #8b5cf6;
            padding: 0.3rem;
            font-weight: 500;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 85%;
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .user-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .sofi-bubble {
            background: #f3f4f6;
            color: #1f2937;
            border-bottom-left-radius: 0.3rem;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #c084fc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .input-area {
            background: white;
            border-top: 0.5px solid #e2e8f0;
            padding: 0.7rem 1rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 2rem;
            background: #f9fafb;
            font-size: 0.85rem;
        }

        .text-input:focus {
            outline: none;
            border-color: #c084fc;
        }

        .send-btn {
            background: #8b5cf6;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .mic-btn {
            background: #f3f4f6;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .siri-ball {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, #ffffff, #e0e0e0);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15), inset 0 0 0 2px white, inset 0 0 0 4px #c084fc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }

        .siri-ball-inner {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }

        .listening {
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(139, 92, 246, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
            }
        }

        .footer-note {
            text-align: center;
            font-size: 0.55rem;
            padding: 0.5rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>✨ Sofía · Asistente IA</h1>
    <div class="status-text" id="statusMsg">🧠 Lista para ayudarte</div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="message">
        <div class="avatar">✨</div>
        <div class="bubble sofi-bubble">Hola, soy Sofía. Puedes hablarme o escribirme. ¿En qué te ayudo?</div>
    </div>
</div>

<div class="input-area">
    <button class="mic-btn" id="micButton">🎙️</button>
    <input type="text" id="textInput" class="text-input" placeholder="Escribe a Sofía...">
    <button class="send-btn" id="sendButton">Enviar</button>
</div>

<div class="siri-ball" id="siriBall">
    <div class="siri-ball-inner">💬</div>
</div>
<div class="footer-note">🎤 Toca la bola para hablar · Escribe para chatear · Funciona sin internet</div>

<script>
    // ========== MEMORIA DE CONVERSACIÓN ==========
    let memoria = [];

    // ========== VOZ DEL SISTEMA ==========
    let synth = window.speechSynthesis;
    let speaking = false;

    function hablar(texto) {
        if (synth.speaking) {
            synth.cancel();
        }
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.95;
        utterance.pitch = 1.1;
        synth.speak(utterance);
    }

    // ========== AGREGAR MENSAJE AL CHAT ==========
    function addMessage(tipo, texto) {
        const container = document.getElementById('chatContainer');
        const div = document.createElement('div');
        div.className = `message ${tipo === 'user' ? 'user-message' : ''}`;
        if (tipo === 'user') {
            div.innerHTML = `
                <div class="avatar">👤</div>
                <div class="bubble user-bubble">${escapeHtml(texto)}</div>
            `;
        } else {
            div.innerHTML = `
                <div class="avatar">✨</div>
                <div class="bubble sofi-bubble">${escapeHtml(texto)}</div>
            `;
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // ========== PROCESAR RESPUESTA ==========
    function procesarPregunta(pregunta) {
        const lower = pregunta.toLowerCase();
        
        // Guardar en memoria
        memoria.push({ pregunta: pregunta, respuesta: null });
        if (memoria.length > 10) memoria.shift();
        
        let respuesta = null;
        
        // Buscar en conocimientos globales
        if (typeof window.conocimientos !== 'undefined' && window.conocimientos) {
            for (let item of window.conocimientos) {
                for (let palabra of item.palabrasClave) {
                    if (lower.includes(palabra)) {
                        respuesta = item.respuesta;
                        break;
                    }
                }
                if (respuesta) break;
            }
        }
        
        // Respuesta por defecto
        if (!respuesta) {
            respuesta = "No tengo información sobre eso. ¿Puedes enseñármela? O pregúntame otra cosa.";
        }
        
        // Actualizar memoria
        memoria[memoria.length - 1].respuesta = respuesta;
        addMessage('sofi', respuesta);
        hablar(respuesta);
        document.getElementById('statusMsg').innerHTML = '✅ Sofía respondió';
        setTimeout(() => {
            document.getElementById('statusMsg').innerHTML = '🎤 Lista para ayudarte';
        }, 2000);
    }

    // ========== RECONOCIMIENTO DE VOZ ==========
    let recognition = null;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;
    }

    const siriBall = document.getElementById('siriBall');
    const micButton = document.getElementById('micButton');
    const textInput = document.getElementById('textInput');
    const sendButton = document.getElementById('sendButton');

    // Escuchar desde la bola
    siriBall.addEventListener('click', () => {
        if (recognition) {
            siriBall.classList.add('listening');
            document.getElementById('statusMsg').innerHTML = '🎤 Escuchando... habla ahora';
            recognition.start();
            recognition.onresult = (event) => {
                const voiceText = event.results[0][0].transcript;
                document.getElementById('statusMsg').innerHTML = `💬 Dijiste: "${voiceText}"`;
                addMessage('user', voiceText);
                procesarPregunta(voiceText);
                siriBall.classList.remove('listening');
            };
            recognition.onend = () => {
                siriBall.classList.remove('listening');
                if (document.getElementById('statusMsg').innerHTML.includes('Escuchando')) {
                    document.getElementById('statusMsg').innerHTML = '🎤 Toca la bola para hablar';
                }
            };
            recognition.onerror = () => {
                siriBall.classList.remove('listening');
                document.getElementById('statusMsg').innerHTML = '❌ No te entendí. Toca de nuevo.';
            };
        } else {
            document.getElementById('statusMsg').innerHTML = '⚠️ Voz no soportada. Usa el teclado.';
        }
    });

    // Botón de micrófono alternativo
    micButton.addEventListener('click', () => {
        siriBall.click();
    });

    // Enviar texto escrito
    sendButton.addEventListener('click', () => {
        const texto = textInput.value.trim();
        if (texto === '') return;
        addMessage('user', texto);
        procesarPregunta(texto);
        textInput.value = '';
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendButton.click();
        }
    });

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Mensaje de bienvenida hablado
    setTimeout(() => {
        hablar("Hola, soy Sofía. Estoy lista para ayudarte.");
    }, 500);
</script>

<!-- Cargar conocimientos externos -->
<script src="conocimientos.js"></script>
</body>
        </html>
