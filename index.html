<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sofía · Asistente IA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sofía">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23c084fc'/%3E%3Ctext x='50' y='67' font-size='45' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui;
            background: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 1rem;
            text-align: center;
            background: white;
            border-bottom: 0.5px solid #e2e8f0;
        }

        .header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-text {
            text-align: center;
            font-size: 0.7rem;
            color: #8b5cf6;
            padding: 0.3rem;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 85%;
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .user-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .sofi-bubble {
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 0.3rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(145deg, #c084fc, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .input-area {
            background: white;
            border-top: 0.5px solid #e2e8f0;
            padding: 0.8rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 1px solid #e2e8f0;
            background: #f9fafb;
            font-size: 0.9rem;
        }

        .send-btn {
            background: #8b5cf6;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .mic-btn {
            background: #f3f4f6;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.55rem;
            padding: 0.5rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>✨ Sofía</h1>
    <div class="status-text" id="statusMsg">🧠 Lista para ayudarte</div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="message">
        <div class="avatar">✨</div>
        <div class="bubble sofi-bubble">Hola, soy Sofía. ¿En qué te ayudo?</div>
    </div>
</div>

<div class="input-area">
    <button class="mic-btn" id="micButton">🎙️</button>
    <input type="text" id="textInput" class="text-input" placeholder="Escribe a Sofía...">
    <button class="send-btn" id="sendButton">Enviar</button>
</div>
<div class="footer-note">🎤 Toca el micrófono para hablar · Escribe para chatear</div>

<script>
    // ========== MEMORIA ==========
    let conocimientosCargados = [];

    // ========== VOZ ==========
    let synth = window.speechSynthesis;
    function hablar(texto) {
        if (synth.speaking) synth.cancel();
        let utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.95;
        synth.speak(utterance);
    }

    // ========== AGREGAR MENSAJE ==========
    function addMessage(tipo, texto) {
        const container = document.getElementById('chatContainer');
        const div = document.createElement('div');
        div.className = `message ${tipo === 'user' ? 'user-message' : ''}`;
        if (tipo === 'user') {
            div.innerHTML = `<div class="avatar">👤</div><div class="bubble user-bubble">${escapeHtml(texto)}</div>`;
        } else {
            div.innerHTML = `<div class="avatar">✨</div><div class="bubble sofi-bubble">${escapeHtml(texto)}</div>`;
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // ========== PROCESAR PREGUNTA ==========
    function procesarPregunta(pregunta) {
        const lower = pregunta.toLowerCase();
        let respuesta = null;

        for (let item of conocimientosCargados) {
            for (let palabra of item.palabrasClave) {
                if (lower.includes(palabra)) {
                    respuesta = item.respuesta;
                    break;
                }
            }
            if (respuesta) break;
        }

        if (!respuesta) {
            respuesta = "No tengo información sobre eso. Pregúntame otra cosa. 💜";
        }

        addMessage('sofi', respuesta);
        hablar(respuesta);
        document.getElementById('statusMsg').innerHTML = '✅ Sofía respondió';
        setTimeout(() => {
            document.getElementById('statusMsg').innerHTML = '🎤 Lista para ayudarte';
        }, 2000);
    }

    // ========== RECONOCIMIENTO DE VOZ ==========
    let recognition = null;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;
    }

    const micButton = document.getElementById('micButton');
    const textInput = document.getElementById('textInput');
    const sendButton = document.getElementById('sendButton');

    micButton.addEventListener('click', () => {
        if (recognition) {
            document.getElementById('statusMsg').innerHTML = '🎤 Escuchando... habla ahora';
            recognition.start();
            recognition.onresult = (event) => {
                const voiceText = event.results[0][0].transcript;
                document.getElementById('statusMsg').innerHTML = `💬 Dijiste: "${voiceText}"`;
                addMessage('user', voiceText);
                procesarPregunta(voiceText);
            };
            recognition.onend = () => {
                document.getElementById('statusMsg').innerHTML = '🎤 Toca el micrófono para hablar';
            };
            recognition.onerror = () => {
                document.getElementById('statusMsg').innerHTML = '❌ No te entendí. Toca de nuevo.';
            };
        } else {
            document.getElementById('statusMsg').innerHTML = '⚠️ Voz no soportada. Usa el teclado.';
        }
    });

    // Enviar texto
    sendButton.addEventListener('click', () => {
        const texto = textInput.value.trim();
        if (texto === '') return;
        addMessage('user', texto);
        procesarPregunta(texto);
        textInput.value = '';
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendButton.click();
    });

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== CARGAR CONOCIMIENTOS ==========
    window.agregarConocimiento = function(item) {
        conocimientosCargados.push(item);
    };

    const archivos = [
        'conocimientos/01-base.js',
        'conocimientos/02-personal.js',
        'conocimientos/03-gracioso.js'
    ];

    function cargarConocimientos() {
        archivos.forEach(archivo => {
            const script = document.createElement('script');
            script.src = archivo;
            script.onerror = () => console.log(`No se pudo cargar ${archivo}`);
            document.head.appendChild(script);
        });
    }

    cargarConocimientos();
    setTimeout(() => {
        hablar("Hola, soy Sofía");
    }, 500);
</script>
</body>
</html>
